<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="description" content="Queue up for the table, report your score, and track the league ladder." />

    <!-- Instrument Serif carries the league name and the status headline;
         Archivo handles everything functional, including score numerals.
         Preconnect first so the fonts aren't the thing holding up paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <title>Billiards League</title>

    <!-- Light or dark before the first paint, so a dark page doesn't
         flash white while the app loads. The same rule as src/theme.js:
         a stored "light"/"dark" choice, otherwise the device's setting. -->
    <script>
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('theme');
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) {
          var toolbar = document.querySelector('meta[name="theme-color"]');
          if (toolbar) toolbar.setAttribute('content', '#15121d');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
